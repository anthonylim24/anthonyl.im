<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F5F2ED" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F5F2ED" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#171613" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- Short label shown under the icon when added to iOS Home Screen.
         The PWA we install is the Korea trip dossier — the only app on
         the site that benefits from a standalone shell. iOS Safari
         reads these synchronously at page load, BEFORE any route
         script runs, so the default has to be the desired install
         identity (not chatbot or BreathFlow). -->
    <meta name="apple-mobile-web-app-title" content="Korea Trip" />
    <meta name="application-name" content="Korea Trip" />
    <meta name="description" content="Anthony Lim - Software Engineer. Ask me anything about my experience, skills, and background." />
    <meta property="og:site_name" content="Anthony Lim" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />

    <link rel="icon" type="image/svg+xml" href="/favicon-chat.svg" />
    <!-- iOS reads the manifest synchronously at page load. The default
         here is the Korea trip — the only PWA on the site. (Per-route
         scripts below are now idempotent.) -->
    <link rel="manifest" href="/korea.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/breathflow-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400&family=Fragment+Mono:ital@0;1&family=Geist:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

    <title>Anthony Lim - Software Engineer</title>

    <script data-route-metadata="breathflow">
      (() => {
        const appPath = location.pathname.replace(/^\/preview\/pr\/\d+(?=\/|$)/, '') || '/';
        const assetBase = (location.pathname.match(/^\/preview\/pr\/\d+/) || [''])[0];
        if (!appPath.startsWith('/breathwork')) return;

        const title = 'BreathFlow';
        const description = 'Timed breathing protocols with published research.';

        function setRouteMeta(selector, attribute, value, content) {
          let element = document.querySelector(selector);
          if (!element) {
            element = document.createElement('meta');
            element.setAttribute(attribute, value);
            document.head.appendChild(element);
          }
          element.setAttribute('content', content);
        }

        const favicon = document.querySelector('link[rel="icon"][type="image/svg+xml"]');
        if (favicon) favicon.setAttribute('href', assetBase + '/favicon-breath.svg');

        document.title = title;
        setRouteMeta('meta[name="description"]', 'name', 'description', description);
        setRouteMeta('meta[property="og:title"]', 'property', 'og:title', title);
        setRouteMeta('meta[property="og:description"]', 'property', 'og:description', description);
        setRouteMeta('meta[name="twitter:title"]', 'name', 'twitter:title', title);
        setRouteMeta('meta[name="twitter:description"]', 'name', 'twitter:description', description);
        // BreathFlow is intentionally NOT a PWA — we don't expose the
        // manifest, apple-mobile-web-app-title, or application-name
        // here so iOS's Add-to-Home-Screen flow defaults to the Korea
        // identity set in the base head.
      })();
    </script>

    <script data-route-metadata="korea">
      (() => {
        const appPath = location.pathname.replace(/^\/preview\/pr\/\d+(?=\/|$)/, '') || '/';
        const assetBase = (location.pathname.match(/^\/preview\/pr\/\d+/) || [''])[0];
        if (!appPath.startsWith('/korea')) return;

        const title = 'South Korea Itinerary — Seoul + Busan';
        const description = 'A 12-day Seoul + Busan trip with reservations, weather, smart links, and a 3D Map Mode that puts you at the center.';

        function setRouteMeta(selector, attribute, value, content) {
          let element = document.querySelector(selector);
          if (!element) {
            element = document.createElement('meta');
            element.setAttribute(attribute, value);
            document.head.appendChild(element);
          }
          element.setAttribute('content', content);
        }

        // Manifest is already /korea.webmanifest by default — this
        // line is now a defensive no-op in case any other code swaps
        // it. (iOS Safari reads the manifest at page load and may
        // ignore JS-driven changes.)
        const manifest = document.querySelector('link[rel="manifest"]');
        if (manifest) manifest.setAttribute('href', assetBase + '/korea.webmanifest');

        // Swap favicon to the Korea variant
        const favicon = document.querySelector('link[rel="icon"][type="image/svg+xml"]');
        if (favicon) favicon.setAttribute('href', assetBase + '/favicon-korea.svg');

        document.title = title;
        setRouteMeta('meta[name="description"]', 'name', 'description', description);
        setRouteMeta('meta[property="og:title"]', 'property', 'og:title', title);
        setRouteMeta('meta[property="og:description"]', 'property', 'og:description', description);
        setRouteMeta('meta[name="twitter:title"]', 'name', 'twitter:title', title);
        setRouteMeta('meta[name="twitter:description"]', 'name', 'twitter:description', description);
        // iOS Home Screen short label (read at Add-to-Home-Screen time)
        setRouteMeta('meta[name="apple-mobile-web-app-title"]', 'name', 'apple-mobile-web-app-title', 'Korea Trip');
        setRouteMeta('meta[name="application-name"]', 'name', 'application-name', 'Korea Trip');
      })();
    </script>

    <style>
      /* html background fills iOS safe areas (status bar, home indicator).
         Must match the page canvas so they blend seamlessly.
         Safari 26 liquid glass on the TOOLBAR is enabled by keeping
         position:fixed/sticky elements transparent (done in components). */
      html { background-color: #F5F2ED; }
      html.dark { background-color: #171613; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
