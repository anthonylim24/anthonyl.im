<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F5F2ED" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F5F2ED" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#171613" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- Short label shown under the icon when added to iOS Home Screen.
         iOS Safari reads these synchronously at page load, BEFORE any
         route script runs, so the server writes each route's own short
         name into the HTML (server/src/shellMeta.ts: "Korea Trip" on
         /trips/korea-2026, "Trips" on other /trips, "Lim", "BreathFlow",
         "anthonyl.im"). These defaults only show in dev. -->
    <meta name="apple-mobile-web-app-title" content="Korea Trip" />
    <meta name="application-name" content="Korea Trip" />
    <meta name="description" content="Meet Lim, a squishy jelly who answers for Anthony Lim. Ask about his work, projects, and engineering background." />
    <meta property="og:site_name" content="Anthony Lim" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" type="image/svg+xml" href="/favicon-chat.svg" />
    <!-- iOS reads the manifest synchronously at page load, so the server
         writes each path's own (server/src/shellMeta.ts manifestForPath):
         /trips.webmanifest on /trips, /korea.webmanifest on the Korea trip
         and, as before, everywhere else. This default only shows in dev. -->
    <link rel="manifest" href="/korea.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/breathflow-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400&family=Fragment+Mono:ital@0;1&family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,100..900,0..100,0..1;1,9..144,100..900,0..100,0..1&family=Fredoka:wdth,wght@75..125,300..700&family=Geist:wght@400;500;600&family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

    <title>Lim — Ask Anthony Lim's AI</title>

    <!-- Route metadata for the SPA. The server strips the static preview tags
         and writes the route's own straight after <meta charset>
         (server/src/shellMeta.ts), above these scripts, so setRouteMeta
         updates that one tag in place. In dev nothing injects and it updates
         the static tags above, or creates the tag. -->
    <script data-route-metadata="shared">
      (() => {
        window.__setRouteMeta = (attribute, value, content) => {
          let element = document.head.querySelector('meta[' + attribute + '="' + value + '"]');
          if (!element) {
            element = document.createElement('meta');
            element.setAttribute(attribute, value);
            document.head.appendChild(element);
          }
          element.setAttribute('content', content);
        };
      })();
    </script>

    <script data-route-metadata="breathflow">
      (() => {
        const appPath = location.pathname.replace(/^\/preview\/pr\/\d+(?=\/|$)/, '') || '/';
        const assetBase = (location.pathname.match(/^\/preview\/pr\/\d+/) || [''])[0];
        if (!appPath.startsWith('/breathwork')) return;

        const title = 'BreathFlow — Guided breathing with a watercolour cat';
        const description = 'Research-backed breathing — box breathing, cyclic sighing, 4-7-8, resonance and more — paced by a hand-painted cat that breathes with you.';
        const setRouteMeta = window.__setRouteMeta;

        const favicon = document.querySelector('link[rel="icon"][type="image/svg+xml"]');
        if (favicon) favicon.setAttribute('href', assetBase + '/favicon-breath.svg');

        document.title = title;
        setRouteMeta('name', 'description', description);
        setRouteMeta('property', 'og:title', title);
        setRouteMeta('property', 'og:description', description);
        setRouteMeta('name', 'twitter:title', title);
        setRouteMeta('name', 'twitter:description', description);
        // BreathFlow is not a PWA: the manifest stays the Korea trip's,
        // whose scope is /trips. Its Home Screen label ("BreathFlow") is
        // in the server's HTML, since iOS reads it before this runs.
      })();
    </script>

    <script data-route-metadata="korea">
      (() => {
        const appPath = location.pathname.replace(/^\/preview\/pr\/\d+(?=\/|$)/, '') || '/';
        const assetBase = (location.pathname.match(/^\/preview\/pr\/\d+/) || [''])[0];
        if (!appPath.startsWith('/korea') && !appPath.startsWith('/trips')) return;
        const korea = appPath.startsWith('/korea') || appPath.startsWith('/trips/korea-2026');
        const title = korea ? 'Seoul + Busan — Korea 2026 trip dossier' : 'Trips — plan a trip, pin by pin';
        const description = korea
          ? 'A 12-day Seoul + Busan trip (May 26 – Jun 6, 2026): reservations, neighbourhoods, the places worth a detour, and a 3D Map Mode.'
          : 'Plan trips on a live 3D map: let AI draft the days, pin every stop, and share the plan with whoever is coming.';
        // iOS Home Screen short label (read at Add-to-Home-Screen time).
        const appName = korea ? 'Korea Trip' : 'Trips';
        const setRouteMeta = window.__setRouteMeta;

        // Every trip installs as "Trips" but Korea's, which keeps its own.
        // The server already wrote the right one; this keeps it right in dev
        // and under a PR preview base. (iOS Safari reads the manifest at page
        // load and may ignore later changes.)
        const manifest = document.querySelector('link[rel="manifest"]');
        if (manifest) manifest.setAttribute('href', assetBase + (korea ? '/korea.webmanifest' : '/trips.webmanifest'));
        const favicon = document.querySelector('link[rel="icon"][type="image/svg+xml"]');
        if (favicon) favicon.setAttribute('href', assetBase + '/favicon-korea.svg');

        document.title = title;
        setRouteMeta('name', 'description', description);
        setRouteMeta('property', 'og:title', title);
        setRouteMeta('property', 'og:description', description);
        setRouteMeta('name', 'twitter:title', title);
        setRouteMeta('name', 'twitter:description', description);
        setRouteMeta('name', 'apple-mobile-web-app-title', appName);
        setRouteMeta('name', 'application-name', appName);
      })();
    </script>

    <style>
      /* html background fills iOS safe areas (status bar, home indicator).
         Must match the page canvas so they blend seamlessly.
         Safari 26 liquid glass on the TOOLBAR is enabled by keeping
         position:fixed/sticky elements transparent (done in components). */
      html { background-color: #F5F2ED; }
      html.dark { background-color: #171613; }

      /* The boot screen (#boot): painted by the script at the end of <body>
         from the route's <template id="boot-…">, before any bundle runs, and
         held open by lib/bootScreen.ts while a route's code or the sign-in
         check is still on its way. Each template carries its own art and
         styles, so a page pays for one world's CSS, and only while it shows.
         Motion is transform and opacity on HTML layers: the compositor keeps
         it moving while the bundles parse. */
      .boot { position: fixed; inset: 0; z-index: 1000; display: grid; place-items: center; overflow: hidden; contain: strict; font-synthesis: none; -webkit-font-smoothing: antialiased; }
      .boot *, .boot *::before, .boot *::after { box-sizing: border-box; margin: 0; }
      .boot svg { display: block; overflow: visible; }
      .boot-stage { position: relative; display: grid; justify-items: center; text-align: center; animation: boot-in 480ms cubic-bezier(0.16, 1, 0.3, 1) 140ms both; }
      .boot-steps { display: grid; }
      .boot-steps > * { grid-area: 1 / 1; opacity: 0; transition: opacity 320ms ease; }
      .boot[data-step="start"] .boot-steps > [data-step="start"],
      .boot[data-step="code"] .boot-steps > [data-step="code"],
      .boot[data-step="auth"] .boot-steps > [data-step="auth"] { opacity: 1; }
      .boot-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
      .boot-retry { position: absolute; left: 50%; bottom: max(28px, env(safe-area-inset-bottom)); translate: -50% 0; min-height: 44px; display: inline-flex; align-items: center; padding: 0 18px; border-radius: 999px; font: 500 14px/1 Inter, system-ui, sans-serif; color: inherit; text-decoration: underline; text-underline-offset: 3px; visibility: hidden; opacity: 0; animation: boot-retry 400ms ease 12s forwards; }
      .boot[data-state="leaving"] { pointer-events: none; }
      .boot[data-state="leaving"][data-exit="quick"] { animation: boot-out 160ms ease both !important; }
      .boot[data-state="leaving"][data-exit="quick"] * { animation-play-state: paused !important; }
      @keyframes boot-in { from { opacity: 0; transform: translateY(10px); } }
      @keyframes boot-out { to { opacity: 0; } }
      @keyframes boot-retry { to { visibility: visible; opacity: 1; } }
      @media (prefers-reduced-motion: reduce) {
        .boot *, .boot *::before, .boot *::after { animation-duration: 1ms !important; animation-delay: 0ms !important; animation-iteration-count: 1 !important; transition: none !important; }
        .boot-retry { animation-delay: 12s !important; }
        .boot[data-state="leaving"] { animation: boot-out 160ms ease both !important; }
      }
    </style>
  </head>
  <body>
    <!-- Inflect's bot-traffic pixel. Its tracking script loads from the SPA
         (lib/analytics.ts); this counts visitors that run no JavaScript. It
         sends the origin only, never the path (invite tokens live there). -->
    <img src="https://www.useinflect.ai/api/bot-traffic/pixel?tk=inf_g1QPFf_RBSCCmqq81XE4FLcr7GQdGCMu&iv=2026-08-12.1" alt="" width="1" height="1" style="display:none" referrerpolicy="origin" />
    <div id="root"></div>
    <noscript>
      <main style="max-width:42rem;margin:3rem auto;padding:0 1rem;font-family:system-ui,sans-serif;line-height:1.6">
        <h1>anthonyl.im</h1>
        <p>
          Anthony Lim's personal site. It hosts Lim, a chatbot about Anthony; BreathFlow, guided breathing; and Trips,
          a map-first trip planner you sign in to. The apps need JavaScript.
        </p>
        <p><a href="/privacy">Privacy Policy</a> · <a href="/terms">Terms of Service</a></p>
      </main>
    </noscript>

    <!-- BOOT-TEMPLATES: one per world. The copy for each step sits in
         .boot-steps; data-label names the screen for assistive tech and
         data-exit-ms is how long its exit plays (lib/bootScreen.ts waits
         that long before removing it). -->
    <template id="boot-lim" data-label="Loading Lim" data-exit-ms="200">
      <div class="boot-stage"></div>
    </template>
    <template id="boot-lab" data-label="Loading the lab" data-exit-ms="520">
      <div class="boot-stage">
        <p class="boot-steps"><span data-step="start">Warming the instruments</span><span data-step="code">Mounting the specimen</span><span data-step="auth">Mounting the specimen</span></p>
      </div>
    </template>
    <template id="boot-breathwork" data-label="Loading BreathFlow" data-exit-ms="480">
      <div class="boot-stage">
        <p class="boot-steps"><span data-step="start">Wetting the paper</span><span data-step="code">Mixing the pigments</span><span data-step="auth">Mixing the pigments</span></p>
      </div>
    </template>
    <template id="boot-trips" data-label="Loading Trips" data-exit-ms="560">
      <div class="boot-stage">
        <p class="boot-steps"><span data-step="start">Unfolding the chart</span><span data-step="code">Laying out the atlas</span><span data-step="auth">Checking you’re signed in</span></p>
      </div>
    </template>
    <template id="boot-auth" data-label="Loading sign-in" data-exit-ms="420">
      <div class="boot-stage">
        <p class="boot-steps"><span data-step="start">Opening the desk</span><span data-step="code">Opening the desk</span><span data-step="auth">Fetching the sign-in form</span></p>
      </div>
    </template>

    <!-- Paints the boot screen before any bundle runs. lib/bootScreen.ts
         calls window.__bootMount again to bring it back for a later wait. -->
    <script data-boot>
      (() => {
        const read = (key) => {
          try { return localStorage.getItem(key); } catch { return null; }
        };
        const appPath = () => location.pathname.replace(/^\/preview\/pr\/\d+(?=\/|$)/, '') || '/';
        const worldOf = (path) =>
          path === '/lab' || path.startsWith('/lab/') ? 'lab'
          : path.startsWith('/breathwork') ? 'breathwork'
          : path.startsWith('/sign-in') || path.startsWith('/sign-up') ? 'auth'
          : path.startsWith('/trips') || path.startsWith('/korea') ? 'trips'
          : 'lim';
        const systemDark = () => matchMedia('(prefers-color-scheme: dark)').matches;
        // Each app's own saved choice, so the screen is already in the theme the app paints next.
        const darkFor = (world) => {
          if (world === 'lim') return read('lim-chat-night') === '1';
          if (world === 'trips') {
            const theme = read('korea-theme');
            return theme === 'dark' || ((theme === null || theme === 'system') && systemDark());
          }
          if (world === 'breathwork') {
            try { return JSON.parse(read('breathwork-settings') || '{}').state.theme === 'dark'; } catch { return false; }
          }
          return false;
        };
        // The trip's own accent, remembered by the workspace the last time it opened (trip id → accent name).
        const accentFor = (path) => {
          const id = (path.match(/^\/trips\/([^/]+)/) || [])[1];
          if (!id || id === 'new' || id === 'join') return null;
          try { return JSON.parse(read('trips-boot-accent') || '{}')[id] || null; } catch { return null; }
        };

        window.__bootMount = (world) => {
          const template = document.getElementById('boot-' + world);
          if (!template) return null;
          const path = appPath();
          const boot = document.createElement('div');
          boot.id = 'boot';
          boot.className = 'boot';
          boot.dataset.world = world;
          boot.dataset.theme = darkFor(world) ? 'dark' : 'light';
          boot.dataset.step = 'start';
          boot.dataset.state = 'showing';
          boot.dataset.exitMs = template.dataset.exitMs || '300';
          boot.dataset.shownAt = String(Math.round(performance.now()));
          const accent = world === 'trips' ? accentFor(path) : null;
          if (accent) boot.dataset.accent = accent;
          boot.setAttribute('role', 'status');
          boot.setAttribute('aria-busy', 'true');
          boot.setAttribute('aria-label', template.dataset.label || 'Loading');
          boot.append(template.content.cloneNode(true));
          const retry = document.createElement('a');
          retry.className = 'boot-retry';
          retry.href = location.href;
          retry.textContent = 'Taking a while? Reload';
          boot.append(retry);
          document.body.insertBefore(boot, document.getElementById('root'));
          return boot;
        };
        window.__bootWorld = worldOf(appPath());
        window.__bootMount(window.__bootWorld);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
