# Installed to /etc/sysctl.d/ by deploy/install-service.sh, which every deploy
# runs.
#
# When one of the listeners sharing a port through SO_REUSEPORT closes, hand
# the connections still queued on it to another listener on the port instead
# of resetting them. deploy/restart.sh relies on this so that a restart drops
# nothing.
net.ipv4.tcp_migrate_req = 1
