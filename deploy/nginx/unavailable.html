<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>anthonyl.im is restarting</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 2rem;
    font: 16px/1.55 Inter, system-ui, sans-serif; background: #F5F2ED; color: #1C1917; text-align: center; }
  h1 { font: 500 clamp(2rem, 6vw, 2.75rem)/1.1 "Cormorant Garamond", Georgia, serif; margin: 0 0 .75rem; }
  p { margin: 0 auto; max-width: 26rem; color: #78716C; }
  @media (prefers-color-scheme: dark) { body { background: #171613; color: #E7E3DE; } p { color: #A8A29E; } }
</style>
</head>
<body>
<main>
  <h1>Back in a moment</h1>
  <p role="status">anthonyl.im is restarting. This page reloads by itself as soon as it is ready.</p>
</main>
<script>
  // Reload once the app answers again; back off so a long outage is not hammered.
  var wait = 2000;
  (function check() {
    setTimeout(function () {
      fetch("/health", { cache: "no-store" })
        .then(function (res) { if (res.ok) location.reload(); else throw 0; })
        .catch(function () { wait = Math.min(wait * 1.5, 15000); check(); });
    }, wait);
  })();
</script>
</body>
</html>
