# /etc/nginx/sites-available/anthonyl.im (symlinked into sites-enabled).
# Installed by deploy/install-droplet.sh. Cloudflare terminates public TLS and
# talks to this server over HTTPS with the Let's Encrypt certificate below.

upstream anthonyl_app {
    # One address, so a refused connection is not retried against ::1.
    server 127.0.0.1:3000 max_fails=0;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    server_name anthonyl.im www.anthonyl.im;

    # Shown while Bun is restarting or down: it polls /health and reloads.
    error_page 502 503 504 /__unavailable.html;
    location = /__unavailable.html {
        internal;
        root /var/www/anthonyl.im;
        add_header Cache-Control "no-store" always;
        add_header Retry-After "5" always;
    }

    location / {
        proxy_pass http://anthonyl_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;

        # Clerk auth responses set several large cookies; the 4k default 502s.
        proxy_buffer_size 32k;
        proxy_buffers 8 32k;
        proxy_busy_buffers_size 64k;

        # Fail fast when Bun is not listening; chat and concierge streams are
        # long-lived and send a ping well inside the read timeout.
        proxy_connect_timeout 5s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/anthonyl.im/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/anthonyl.im/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name anthonyl.im www.anthonyl.im;

    if ($host = www.anthonyl.im) {
        return 301 https://$host$request_uri;
    }
    if ($host = anthonyl.im) {
        return 301 https://$host$request_uri;
    }
    return 404;
}
