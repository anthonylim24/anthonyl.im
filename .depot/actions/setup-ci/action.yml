name: Setup CI
description: >
  Bun + dependency caches shared by PR and deploy workflows.
  Copy of .github/actions/setup-ci for Depot CI (Origin Apps).

inputs:
  install-root:
    description: Run `bun install --frozen-lockfile` at the repo root
    required: false
    default: "false"
  install-frontend:
    description: Run `bun install --frozen-lockfile` in frontend/
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Set up Bun
      id: bun
      continue-on-error: true
      uses: oven-sh/setup-bun@v2

    - name: Wait before Bun retry
      if: steps.bun.outcome == 'failure'
      shell: bash
      run: sleep 20

    - name: Set up Bun (retry)
      id: bun-retry
      if: steps.bun.outcome == 'failure'
      continue-on-error: true
      uses: oven-sh/setup-bun@v2

    - name: Wait before Bun last attempt
      if: steps.bun.outcome == 'failure' && steps.bun-retry.outcome == 'failure'
      shell: bash
      run: sleep 30

    - name: Set up Bun (last attempt)
      if: steps.bun.outcome == 'failure' && steps.bun-retry.outcome == 'failure'
      uses: oven-sh/setup-bun@v2

    - name: Cache Bun install cache
      uses: actions/cache@v5
      with:
        path: ~/.bun/install/cache
        key: ${{ runner.os }}-bun-pkg-${{ hashFiles('bun.lock', 'frontend/bun.lock') }}
        restore-keys: |
          ${{ runner.os }}-bun-pkg-

    - name: Cache root node_modules
      if: inputs.install-root == 'true'
      uses: actions/cache@v5
      with:
        path: node_modules
        key: ${{ runner.os }}-nm-root-${{ hashFiles('bun.lock') }}
        restore-keys: |
          ${{ runner.os }}-nm-root-

    - name: Cache frontend node_modules
      if: inputs.install-frontend == 'true'
      uses: actions/cache@v5
      with:
        path: frontend/node_modules
        key: ${{ runner.os }}-nm-fe-${{ hashFiles('frontend/bun.lock') }}
        restore-keys: |
          ${{ runner.os }}-nm-fe-

    - name: Install root deps
      if: inputs.install-root == 'true'
      shell: bash
      run: bun install --frozen-lockfile

    - name: Install frontend deps
      if: inputs.install-frontend == 'true'
      shell: bash
      working-directory: frontend
      run: bun install --frozen-lockfile
