name: Setup CI
description: >
  Bun (pinned by .bun-version) + dependency caches shared by the PR, preview
  and deploy workflows. Restores linked node_modules trees keyed on the exact
  lockfile; the package tarball cache is only fetched when a tree misses.

inputs:
  install-root:
    description: Run `bun install --frozen-lockfile` at the repo root
    required: false
    default: "false"
  install-frontend:
    description: Run `bun install --frozen-lockfile` in frontend/
    required: false
    default: "false"

runs:
  using: composite
  steps:
    # GitHub Releases occasionally 503s (`oven-sh/setup-bun` already retries
    # twice internally, then gives up). Extra attempts with a pause keep a
    # transient CDN blip from failing pr-gate.
    - name: Set up Bun
      id: bun
      continue-on-error: true
      uses: oven-sh/setup-bun@v2
      with:
        bun-version-file: .bun-version

    - name: Wait before Bun retry
      if: steps.bun.outcome == 'failure'
      shell: bash
      run: sleep 20

    - name: Set up Bun (retry)
      id: bun-retry
      if: steps.bun.outcome == 'failure'
      continue-on-error: true
      uses: oven-sh/setup-bun@v2
      with:
        bun-version-file: .bun-version

    - name: Wait before Bun last attempt
      if: steps.bun.outcome == 'failure' && steps.bun-retry.outcome == 'failure'
      shell: bash
      run: sleep 30

    - name: Set up Bun (last attempt)
      if: steps.bun.outcome == 'failure' && steps.bun-retry.outcome == 'failure'
      uses: oven-sh/setup-bun@v2
      with:
        bun-version-file: .bun-version

    # Linked node_modules trees, keyed on the exact lockfile and Bun version.
    # No restore-keys: a stale tree makes `bun install` relink most of it
    # anyway, and an exact hit is what makes setup take a few seconds.
    - name: Cache root node_modules
      id: nm-root
      if: inputs.install-root == 'true'
      uses: actions/cache@v6
      with:
        path: node_modules
        key: ${{ runner.os }}-nm-root-${{ hashFiles('.bun-version', 'bun.lock') }}

    - name: Cache frontend node_modules
      id: nm-fe
      if: inputs.install-frontend == 'true'
      uses: actions/cache@v6
      with:
        path: frontend/node_modules
        key: ${{ runner.os }}-nm-fe-${{ hashFiles('.bun-version', 'frontend/bun.lock') }}

    # Package tarball cache. Only worth the restore when a tree above missed
    # (a lockfile change), so the common path skips it entirely.
    - name: Cache Bun install cache
      if: >-
        (inputs.install-root == 'true' && steps.nm-root.outputs.cache-hit != 'true') ||
        (inputs.install-frontend == 'true' && steps.nm-fe.outputs.cache-hit != 'true')
      uses: actions/cache@v6
      with:
        path: ~/.bun/install/cache
        key: ${{ runner.os }}-bun-pkg-${{ hashFiles('bun.lock', 'frontend/bun.lock') }}
        restore-keys: |
          ${{ runner.os }}-bun-pkg-

    - name: Install root deps
      if: inputs.install-root == 'true'
      shell: bash
      run: bun install --frozen-lockfile

    - name: Install frontend deps
      if: inputs.install-frontend == 'true'
      shell: bash
      working-directory: frontend
      run: bun install --frozen-lockfile
