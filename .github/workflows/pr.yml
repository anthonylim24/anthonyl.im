name: PR Checks

# The PR gate. Everything that lands on `main` flows through here first.
#
# Branch protection on `main` requires the aggregate `pr-gate` check
# (see .github/branch-protection.json). Individual jobs stay visible in
# the Actions UI for fast triage; only `pr-gate` is the required context.
#
# Design choices:
#   - Parallel jobs for independent signals (server / frontend / cloud).
#   - Shared composite setup (.github/actions/setup-ci) caches Bun packages
#     AND node_modules so 5 jobs don't each pay a cold install.
#   - Concurrency cancels stale runs on the same PR.
#   - Frozen lockfiles everywhere — Dependabot must land a matching
#     bun.lock (text format; see dependabot.yml package-ecosystem: bun).
#   - Frontend build already runs `tsc -b` (`bun run build`); the dedicated
#     typecheck job still exists for a faster --noEmit fail path and clearer
#     failure attribution.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Shared stub env for any job that loads server/src/config.ts
  KLUSTER_API_KEY: ci-stub
  KLUSTER_API_BASE_URL: https://example.invalid
  IG_WORKER_ENABLED: "false"

jobs:
  # ─── 1. Server tests + module-load smoke ────────────────────────────
  pr-server-tests:
    name: pr-server-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-ci
        with:
          install-root: "true"
      - name: Server tests (mocked, includes appLoad smoke)
        run: bun test --bail server/src

  # ─── 2. Frontend typecheck ──────────────────────────────────────────
  pr-frontend-typecheck:
    name: pr-frontend-typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-ci
        with:
          install-root: "true"
          install-frontend: "true"
      - name: Frontend typecheck (tsc -b --noEmit)
        working-directory: frontend
        run: bun run typecheck

  # ─── 3. Frontend build ──────────────────────────────────────────────
  pr-frontend-build:
    name: pr-frontend-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-ci
        with:
          install-frontend: "true"
      - name: Build with CI env stubs
        working-directory: frontend
        # Stub frontend env so the build doesn't fail on missing secrets.
        # Production deploy writes FRONTEND_ENV; this only needs any file
        # Vite will load for import.meta.env shape checks.
        run: |
          if [ ! -f .env ]; then
            if [ -f .env.local.example ]; then
              cp .env.local.example .env
            elif [ -f .env.example ]; then
              cp .env.example .env
            fi
          fi
          bun run build

  # ─── 4. Frontend unit tests ─────────────────────────────────────────
  # Required since PR #397 cleaned the stale BreathFlow-PWA assertions.
  pr-frontend-tests:
    name: pr-frontend-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-ci
        with:
          install-frontend: "true"
      - name: Vitest
        working-directory: frontend
        run: bun run test:run

  # ─── 5. Cloud-agent setup smoke ─────────────────────────────────────
  # Verifies Codex/Claude bootstrap still works end-to-end. Intentionally
  # re-runs the local verify gate via setup.sh → check.sh so a broken
  # cloud path fails here even if other jobs are green via a different
  # install path.
  pr-cloud-setup:
    name: pr-cloud-setup
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-ci
      - name: Run codex setup (the cloud bootstrap path)
        run: bash .codex/setup.sh
      - name: Run codex check (the cloud verify gate)
        run: bash .codex/check.sh
      - name: Run setup-invariant lints
        run: |
          bash .codex/cloud-setup.test.sh
          bash .claude/cloud/cloud-setup.test.sh

  # ─── Aggregate status ───────────────────────────────────────────────
  # Single check branch protection depends on. Add/remove jobs above
  # without re-configuring the protected branch — just update `needs`.
  pr-gate:
    name: pr-gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - pr-server-tests
      - pr-frontend-typecheck
      - pr-frontend-build
      - pr-frontend-tests
      - pr-cloud-setup
    if: always()
    steps:
      - name: Gate result
        run: |
          results=(
            "${{ needs.pr-server-tests.result }}"
            "${{ needs.pr-frontend-typecheck.result }}"
            "${{ needs.pr-frontend-build.result }}"
            "${{ needs.pr-frontend-tests.result }}"
            "${{ needs.pr-cloud-setup.result }}"
          )
          failed=0
          for r in "${results[@]}"; do
            if [ "$r" != "success" ]; then
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then
            echo "::error::One or more PR checks failed — not safe to merge."
            printf '  %s\n' "${results[@]}"
            exit 1
          fi
          echo "All PR checks passed."
