name: PR Checks

# The PR gate. Everything that lands on `main` flows through here first.
# Job bodies live in deploy/ci/*.sh (shared with Depot + Origin).
#
# Branch protection on `main` requires the aggregate `pr-gate` check
# (see .github/branch-protection.json). Individual jobs stay visible in
# the Actions UI for fast triage; only `pr-gate` is the required context.
#
# Design choices:
#   - Parallel jobs for independent signals (server / frontend / cloud).
#   - Shared composite setup (.github/actions/setup-ci) caches Bun packages
#     AND node_modules so 5 jobs don't each pay a cold install.
#   - Concurrency cancels stale runs on the same PR.
#   - Frozen lockfiles everywhere — Dependabot must land a matching
#     bun.lock (text format; see dependabot.yml package-ecosystem: bun).
#   - Frontend build already runs `tsc -b` (`bun run build`); the dedicated
#     typecheck job still exists for a faster --noEmit fail path and clearer
#     failure attribution.
#   - `pr-gate` starts immediately (no `needs:`) so GitHub registers the
#     required check as in_progress from the first seconds of the run.
#     A `needs:` aggregate is invisible until siblings finish, which makes
#     merge UIs (Cursor, `gh pr checks`) think CI is green and then fail
#     squash-merge with "required status checks have not completed yet".

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  # Merge-queue PRs never fire `pull_request`; without this, required
  # checks stay unreported and the queue blocks forever.
  merge_group:

concurrency:
  group: ${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || format('merge-group-{0}', github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Shared stub env for any job that loads server/src/config.ts
  KLUSTER_API_KEY: ci-stub
  KLUSTER_API_BASE_URL: https://example.invalid
  IG_WORKER_ENABLED: "false"

jobs:
  # ─── 1. Server tests + module-load smoke ────────────────────────────
  pr-server-tests:
    name: pr-server-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
        with:
          install-root: "true"
      - name: Server tests (mocked, includes appLoad smoke)
        run: bash deploy/ci/server-tests.sh

  # ─── 2. Frontend typecheck ──────────────────────────────────────────
  pr-frontend-typecheck:
    name: pr-frontend-typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
        with:
          install-root: "true"
          install-frontend: "true"
      - name: Frontend typecheck (tsc -b --noEmit)
        run: bash deploy/ci/frontend-typecheck.sh

  # ─── 3. Frontend build ──────────────────────────────────────────────
  pr-frontend-build:
    name: pr-frontend-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
        with:
          install-frontend: "true"
      - name: Build with CI env stubs
        env:
          MODE: stub
        run: bash deploy/ci/frontend-build.sh

  # ─── 4. Frontend unit tests ─────────────────────────────────────────
  # Required since PR #397 cleaned the stale BreathFlow-PWA assertions.
  pr-frontend-tests:
    name: pr-frontend-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
        with:
          install-frontend: "true"
      - name: Vitest
        run: bash deploy/ci/frontend-tests.sh

  # ─── 5. Cloud-agent setup smoke ─────────────────────────────────────
  # Verifies Codex/Claude bootstrap still works end-to-end. Intentionally
  # re-runs the local verify gate via setup.sh → check.sh so a broken
  # cloud path fails here even if other jobs are green via a different
  # install path.
  pr-cloud-setup:
    name: pr-cloud-setup
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
      - name: Run codex setup + check + invariant lints
        run: bash deploy/ci/cloud-setup.sh

  # ─── Aggregate status ───────────────────────────────────────────────
  # Single check branch protection depends on. Starts with no `needs:` so
  # GitHub reports `pr-gate` as in_progress immediately (see file header).
  # Add/remove sibling jobs by updating REQUIRED_JOBS below — do not add
  # `needs:` back or the merge-race returns.
  pr-gate:
    name: pr-gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
      statuses: write
    steps:
      - name: Wait for sibling jobs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          DETAILS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          REQUIRED_JOBS=(
            pr-server-tests
            pr-frontend-typecheck
            pr-frontend-build
            pr-frontend-tests
            pr-cloud-setup
          )

          post_status() {
            local state="$1"
            local desc="$2"
            gh api --method POST "repos/${REPO}/statuses/${HEAD_SHA}" \
              -f state="$state" \
              -f context=pr-gate \
              -f description="$desc" \
              -f target_url="$DETAILS_URL" >/dev/null \
              || echo "::warning::Failed to post commit status '$state' for pr-gate"
          }

          post_status pending "PR checks running"

          deadline=$((SECONDS + 1320)) # 22 minutes; job timeout is 25
          while (( SECONDS < deadline )); do
            if ! json="$(gh api "repos/${REPO}/actions/runs/${RUN_ID}/jobs?per_page=100")"; then
              echo "WARN: failed to list jobs for run ${RUN_ID}; retrying"
              sleep 8
              continue
            fi

            pending=()
            failed=()
            for name in "${REQUIRED_JOBS[@]}"; do
              # sort_by(.id)|last is the latest attempt; last on [] is null
              # (max_by on [] errors in some jq versions and would trip set -e).
              job="$(jq -c --arg n "$name" '[.jobs[] | select(.name == $n)] | sort_by(.id) | last // empty' <<<"$json")"
              if [[ -z "$job" ]]; then
                pending+=("$name")
                continue
              fi
              status="$(jq -r '.status // empty' <<<"$job")"
              conclusion="$(jq -r '.conclusion // empty' <<<"$job")"
              if [[ -z "$status" || "$status" != "completed" ]]; then
                pending+=("$name")
                continue
              fi
              if [[ "$conclusion" != "success" ]]; then
                failed+=("$name=$conclusion")
              fi
            done

            if (( ${#pending[@]} == 0 )); then
              if (( ${#failed[@]} > 0 )); then
                echo "::error::One or more PR checks failed — not safe to merge."
                printf '  %s\n' "${failed[@]}"
                post_status failure "One or more PR checks failed"
                exit 1
              fi
              post_status success "All PR checks passed"
              echo "All PR checks passed."
              exit 0
            fi

            echo "Waiting on: ${pending[*]}"
            sleep 8
          done

          echo "::error::Timed out waiting for sibling PR jobs to complete."
          post_status failure "Timed out waiting for PR checks"
          exit 1
