name: Build & Deploy

# Ships main → DigitalOcean droplet.
#
# Invariants (do not break):
#   - Frontend is built on the GH runner (never on the 1 GB droplet).
#   - Dist is SCP'd into place; the server only restarts after dist/index.html exists.
#   - Post-deploy smoke hits live HTTPS routes; systemd "active" alone is not enough.
#   - Backend install uses --frozen-lockfile so a drifted lock cannot ship.
#
# Deploy strategy: prepare ~/anthonyl.im.next, then atomic swap into
# ~/anthonyl.im before restarting the anthonyl.im systemd unit. Avoids the
# old rm -rf + clone window where the live path briefly disappeared.

on:
  push:
    branches: [main]
    # Nothing the droplet serves changes with these, so a docs-only merge
    # does not restart production.
    paths-ignore:
      - "*.md"
      - "docs/**"
      - ".agents/**"
      - ".claude/**"
      - ".codex/**"
      - ".cursor/**"
      - ".github/dependabot.yml"
      - ".github/branch-protection.json"
      - ".github/workflows/pr.yml"
      - ".github/workflows/preview.yml"
      - ".github/workflows/uptime.yml"
      - ".github/workflows/dependabot-auto-merge.yml"
  workflow_dispatch:

# Never cancel an in-flight production deploy; queue the next one instead.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  IG_WORKER_ENABLED: "false"

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun + caches
        uses: ./.github/actions/setup-ci
        with:
          install-root: "true"
          install-frontend: "true"

      # Re-run the server gate on main while the frontend builds. PR already
      # passed, but a force-push or protection misconfig must not ship red
      # tests. The two share the runner's cores instead of running in series.
      - name: Server tests + frontend build
        # Secrets and vars reach the shell as environment variables, never as
        # text spliced into the script (a `$` or quote in a value would be
        # expanded or break the line). The names carry no VITE_ prefix on
        # purpose: Vite gives process env priority over .env, so an empty
        # VITE_* here would blank the value FRONTEND_ENV supplies.
        env:
          FRONTEND_ENV: ${{ secrets.FRONTEND_ENV }}
          IN_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
          IN_CLERK_PROXY_URL: ${{ vars.VITE_CLERK_PROXY_URL }}
          IN_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          bun test --parallel --bail server/src > server-tests.log 2>&1 &
          TESTS_PID=$!

          # Shared with preview.yml so PR previews bake the same Clerk and
          # Supabase values as production.
          bash deploy/write-frontend-env.sh frontend/.env
          (cd frontend && bun run build)

          if ! wait "$TESTS_PID"; then
            cat server-tests.log
            echo "::error::Server tests failed — not deploying."
            exit 1
          fi
          tail -n 6 server-tests.log

      # Stage the next release under ~/anthonyl.im.next (does not touch the
      # live tree yet). System tools install is idempotent + non-fatal.
      - name: Stage backend on droplet
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          key: ${{ secrets.SSH_KEY }}
          username: ${{ secrets.SSH_USERNAME }}
          script: |
            set -euo pipefail
            export PATH="$HOME/.bun/bin:/usr/local/bin:/usr/bin:/bin:$PATH"

            NEXT="$HOME/anthonyl.im.next"
            REPO="git@github.com:anthonylim24/anthonyl.im.git"

            # Disk preflight. The droplet is small and a full disk used to
            # surface as a cryptic clone or scp failure. Report free space,
            # reclaim only what the next steps re-create (the previous staging
            # tree, Bun's download cache, day-old temp archives owned by this
            # user), and stop with a usage breakdown if that isn't enough.
            # Logs and live data are never touched here.
            free_mb() { df -Pm "$HOME" | awk 'NR==2 { print $4 }'; }
            NEED_MB=300
            rm -rf "$NEXT"
            echo "[deploy] disk: $(free_mb) MB free on $(df -P "$HOME" | awk 'NR==2 { print $6 }')"
            if [ "$(free_mb)" -lt 800 ]; then
              echo "[deploy] low disk — clearing re-creatable caches"
              rm -rf "$HOME/.bun/install/cache" || true
              find /tmp -maxdepth 1 -user "$(id -un)" -mtime +0 \
                \( -name '*.tar.gz' -o -name 'tmp.*' \) -exec rm -rf {} + 2>/dev/null || true
              echo "[deploy] disk after cleanup: $(free_mb) MB free"
            fi
            if [ "$(free_mb)" -lt "$NEED_MB" ]; then
              echo "::error::Droplet has $(free_mb) MB free; staging needs about $NEED_MB MB. Largest directories follow."
              du -xm --max-depth=2 "$HOME" 2>/dev/null | sort -rn | head -25 || true
              du -xsm /var/log /tmp 2>/dev/null || true
              exit 1
            fi

            # Stage into a sibling directory so the live tree keeps serving
            # until the atomic swap step. Shallow clone keeps droplet disk low.
            git clone --depth=1 --branch main "$REPO" "$NEXT"
            cd "$NEXT"

            cp "$HOME/.env" "$NEXT/.env"
            cp "$HOME/.env" "$NEXT/frontend/.env"

            # Run the same Bun the tests ran on (.bun-version). The installer
            # swaps the binary by rename, so the live process is unaffected
            # until the restart below.
            WANT_BUN="$(tr -d '[:space:]' < "$NEXT/.bun-version")"
            HAVE_BUN="$("$HOME/.bun/bin/bun" --version 2>/dev/null || echo none)"
            if [ "$HAVE_BUN" != "$WANT_BUN" ]; then
              echo "[deploy] bun $HAVE_BUN → $WANT_BUN"
              curl -fsSL https://bun.sh/install | bash -s "bun-v$WANT_BUN"
            fi
            export PATH="$HOME/.bun/bin:$PATH"
            bun install --frozen-lockfile

            # System tools the IG places worker needs. Non-fatal — worker
            # degrades to caption-only when these are missing.

            if ! command -v yt-dlp >/dev/null 2>&1; then
              echo "[deploy] yt-dlp missing — installing latest standalone binary"
              sudo curl -fsSL https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp \
                -o /usr/local/bin/yt-dlp \
                && sudo chmod a+rx /usr/local/bin/yt-dlp \
                || echo "[deploy] WARN: yt-dlp install failed; video pipeline will fall back to direct CDN fetch"
            fi

            if ! command -v ffmpeg >/dev/null 2>&1; then
              echo "[deploy] ffmpeg missing — trying apt first, static binary as fallback"
              (sudo apt-get install -y -qq ffmpeg 2>&1 \
                | grep -v -E '^E: The repository' || true) >/dev/null || true
              if ! command -v ffmpeg >/dev/null 2>&1; then
                echo "[deploy] apt install of ffmpeg failed — fetching static binary"
                TMPF=$(mktemp -d)
                if curl -fsSL https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz \
                     -o "$TMPF/ffmpeg.tar.xz" \
                   && tar -xf "$TMPF/ffmpeg.tar.xz" -C "$TMPF" \
                   && FFBIN=$(find "$TMPF" -name ffmpeg -type f | head -1) \
                   && [ -n "$FFBIN" ]; then
                  sudo mv "$FFBIN" /usr/local/bin/ffmpeg
                  sudo chmod a+rx /usr/local/bin/ffmpeg
                else
                  echo "[deploy] WARN: ffmpeg static-binary install also failed; transcription/frame-OCR will be skipped per-job"
                fi
                rm -rf "$TMPF"
              fi
            fi

            if ! command -v dev-browser >/dev/null 2>&1; then
              echo "[deploy] dev-browser missing — installing globally"
              if sudo npm install -g dev-browser 2>&1 | tail -3; then
                dev-browser install 2>&1 | tail -3 \
                  || echo "[deploy] WARN: dev-browser install (binary download) failed; headless fallback will be skipped"
              else
                echo "[deploy] WARN: dev-browser global install failed; headless fallback will be skipped"
              fi
            fi

            echo "[deploy] staged $NEXT"
            echo "[deploy] yt-dlp: $(command -v yt-dlp >/dev/null 2>&1 && yt-dlp --version 2>/dev/null || echo MISSING)"
            echo "[deploy] ffmpeg: $(command -v ffmpeg >/dev/null 2>&1 && ffmpeg -version 2>/dev/null | head -1 || echo MISSING)"
            echo "[deploy] dev-browser: $(command -v dev-browser >/dev/null 2>&1 && dev-browser --version 2>/dev/null || echo MISSING)"

      # Upload CI-built dist into the staged tree (not the live tree yet).
      # scp-action preserves source path, so "frontend/dist" + target
      # "anthonyl.im.next" lands at ~/anthonyl.im.next/frontend/dist.
      - name: Upload frontend build to staging
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          key: ${{ secrets.SSH_KEY }}
          username: ${{ secrets.SSH_USERNAME }}
          source: "frontend/dist"
          target: "anthonyl.im.next"

      - name: Atomic swap + restart
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          key: ${{ secrets.SSH_KEY }}
          username: ${{ secrets.SSH_USERNAME }}
          script: |
            set -euo pipefail
            # Non-interactive SSH inherits a minimal PATH that often omits
            # /usr/local/bin (where `sudo npm install -g` lands binaries).
            export PATH="$HOME/.bun/bin:/usr/local/bin:/usr/bin:/bin:$PATH"

            LIVE="$HOME/anthonyl.im"
            NEXT="$HOME/anthonyl.im.next"
            PREV="$HOME/anthonyl.im.prev"

            if [ ! -f "$NEXT/frontend/dist/index.html" ]; then
              echo "ERROR: $NEXT/frontend/dist/index.html not found"
              ls -laR "$NEXT/frontend/" 2>/dev/null || echo "frontend/ dir missing"
              exit 1
            fi
            echo "dist verified: $(ls "$NEXT/frontend/dist/" | wc -l) entries"

            echo "[deploy] PATH=$PATH"
            echo "[deploy] yt-dlp: $(command -v yt-dlp >/dev/null && which yt-dlp || echo MISSING)"
            echo "[deploy] ffmpeg: $(command -v ffmpeg >/dev/null && which ffmpeg || echo MISSING)"
            echo "[deploy] dev-browser: $(command -v dev-browser >/dev/null && which dev-browser || echo MISSING)"

            # Keep earlier builds' hashed chunks for two weeks. A tab left
            # open across a deploy still asks for the old names when it lazy
            # loads a sheet or the 3D view; without them the import fails.
            # -n never overwrites the new build, -p keeps each file's age.
            if [ -d "$LIVE/frontend/dist/assets" ]; then
              cp -pnR "$LIVE/frontend/dist/assets/." "$NEXT/frontend/dist/assets/" 2>/dev/null || true
              find "$NEXT/frontend/dist/assets" -type f -mtime +14 -delete || true
              echo "[deploy] assets after carry-over: $(ls "$NEXT/frontend/dist/assets" | wc -l) files, $(du -sh "$NEXT/frontend/dist/assets" | cut -f1)"
            fi

            # Atomic swap: live → prev, next → live. Downtime is only the
            # restart window, not a missing directory during clone.
            rm -rf "$PREV"
            if [ -d "$LIVE" ]; then
              mv "$LIVE" "$PREV"
            fi
            mv "$NEXT" "$LIVE"

            # The server runs as the anthonyl.im systemd unit
            # (deploy/systemd/anthonyl.im.service: NODE_ENV=production, the
            # PATH yt-dlp and ffmpeg need, the 700M memory ceiling, logs in
            # journald). install-service.sh installs that unit and the
            # watchdog from the release being started, and the first time,
            # hands the server over from PM2. The rollback path below goes
            # through this function too, so a unit change rolls back with
            # the release that brought it. Each step returns on failure:
            # `if start_app` suspends set -e inside the function.
            start_app() {
              if [ -f "$LIVE/deploy/install-service.sh" ]; then
                bash "$LIVE/deploy/install-service.sh" || return 1
              fi
              # A hand-over that did not happen leaves PM2 serving on :3000.
              # Starting the unit then would crash-loop beside it while PM2's
              # copy answered /health, so a broken deploy would look healthy.
              if systemctl is-active --quiet pm2-root.service; then
                echo "ERROR: pm2-root is still active; not starting the unit"
                return 1
              fi
              # restart.sh keeps a second copy of the release listening on
              # :3000 while the unit restarts, so nginx never finds the port
              # closed. A release from before it restarts the plain way.
              if [ -f "$LIVE/deploy/restart.sh" ]; then
                bash "$LIVE/deploy/restart.sh"
              else
                systemctl restart anthonyl.im.service
              fi
            }
            # Healthy means the new process answers /health, not just that
            # systemd calls the unit active. Usually true within a second.
            # restart.sh has stopped its bridge by now and the restart waited
            # for the old process to exit, so only the new one answers here.
            wait_healthy() {
              for _ in $(seq 1 40); do
                if curl -fsS --max-time 2 http://127.0.0.1:3000/health 2>/dev/null \
                    | grep -q '"status":"ok"' \
                  && systemctl is-active --quiet anthonyl.im.service; then
                  return 0
                fi
                sleep 0.5
              done
              return 1
            }

            # A failed `systemctl restart` (bun missing, say) takes the
            # rollback path too instead of stopping the script under set -e.
            if start_app && wait_healthy; then
              journalctl -u anthonyl.im.service -n 15 --no-pager -o cat
              echo ""
              echo 'Deployment successful to Digital Ocean'
              rm -rf "$PREV"
            else
              echo "ERROR: /health did not come up — attempting rollback to prev"
              journalctl -u anthonyl.im.service -n 40 --no-pager -o cat || true
              systemctl status anthonyl.im.service --no-pager || true
              if [ -d "$PREV" ]; then
                rm -rf "$LIVE"
                mv "$PREV" "$LIVE"
                if start_app && wait_healthy; then
                  echo "[deploy] rolled back to previous release"
                elif systemctl is-active --quiet pm2-root.service; then
                  echo "[deploy] the hand-over did not happen; PM2 still serves the previous release"
                else
                  echo "ERROR: the previous release did not come up either"
                  journalctl -u anthonyl.im.service -n 20 --no-pager -o cat || true
                fi
              fi
              exit 1
            fi

      # Post-deploy smoke. Last line of defense: systemd "active" can lie if
      # the app crashes on first request. Probe health JSON + SPA shells.
      - name: Post-deploy smoke (live URL healthy + SPA shell)
        run: |
          set -euo pipefail
          BASE="https://anthonyl.im"
          echo "[smoke] waiting for /health"
          OK=0
          for attempt in 1 2 3 4 5 6; do
            if BODY="$(curl -fsSL --max-time 10 "$BASE/health" 2>/dev/null)"; then
              if echo "$BODY" | grep -q '"status":"ok"'; then
                echo "[smoke] /health OK on attempt $attempt — $BODY"
                OK=1
                break
              fi
              echo "[smoke] /health returned unexpected body: $BODY"
            else
              echo "[smoke] /health not ready (attempt $attempt)"
            fi
            sleep 3
          done
          if [ "$OK" -ne 1 ]; then
            echo "::error::Post-deploy smoke failed — $BASE/health did not return status ok"
            exit 1
          fi

          # path|text the page must contain. /home, /privacy and /terms are
          # static pages; the rest are the SPA shell ("/" is Lim).
          SHELL='<div id="root">'
          CHECKS=(
            "/|$SHELL"
            "/home|<title>anthonyl.im · Anthony Lim</title>"
            "/privacy|<title>Privacy Policy · anthonyl.im</title>"
            "/terms|<title>Terms of Service · anthonyl.im</title>"
            "/lab|$SHELL"
            "/breathwork|$SHELL"
            "/trips|$SHELL"
            "/trips/korea-2026|$SHELL"
          )
          for check in "${CHECKS[@]}"; do
            path="${check%%|*}"
            expect="${check#*|}"
            URL="${BASE}${path}"
            OK=0
            for attempt in 1 2 3; do
              echo "[smoke] attempt $attempt — GET $URL"
              if BODY="$(curl -fsSL --max-time 15 "$URL")"; then
                if echo "$BODY" | grep -qF "$expect"; then
                  echo "[smoke] OK — $path"
                  OK=1
                  break
                fi
                echo "[smoke] WARN: 200 OK but $path is missing: $expect; retrying"
              fi
              sleep 3
            done
            if [ "$OK" -ne 1 ]; then
              echo "::error::Post-deploy smoke failed — $URL did not serve: $expect"
              exit 1
            fi
          done
          echo "[smoke] all routes OK"

          # Dependencies (Clerk, Supabase). A warning, not a failure: an outage
          # at a provider is not a reason to roll this build back.
          if READY="$(curl -fsS --max-time 15 "$BASE/health/ready" 2>/dev/null)"; then
            echo "[smoke] /health/ready — $READY"
          else
            echo "::warning::/health/ready reports a degraded dependency: $(curl -sS --max-time 15 "$BASE/health/ready" || true)"
          fi
